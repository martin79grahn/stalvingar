<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stålvingar</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* Stålvingar – a horizontal propeller-plane shoot 'em up.
   Power system: red planes (and whole red squadrons) drop pods. Each pod moves the highlight one
   step along the power bar at the bottom; the POWER button takes the highlighted upgrade. */

// ============================================================ setup
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const H = 216, TOP = 11, BAR_H = 14, PF_BOT = H - BAR_H, HORIZON = 148, WATER = PF_BOT - 6;
let W = 384, SCALE = 1;

const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const chance = p => Math.random() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function hexRGB(h) { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(c1, c2, t) { const a = hexRGB(c1), b = hexRGB(c2); return "#" + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, "0")).join(""); }
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("stalvingar." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("stalvingar." + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

// ============================================================ bitmap font (5x7)
const FONT = {
  A: [14, 17, 17, 31, 17, 17, 17], B: [30, 17, 17, 30, 17, 17, 30], C: [14, 17, 16, 16, 16, 17, 14], D: [30, 17, 17, 17, 17, 17, 30],
  E: [31, 16, 16, 30, 16, 16, 31], F: [31, 16, 16, 30, 16, 16, 16], G: [14, 17, 16, 23, 17, 17, 15], H: [17, 17, 17, 31, 17, 17, 17],
  I: [14, 4, 4, 4, 4, 4, 14], J: [7, 2, 2, 2, 2, 18, 12], K: [17, 18, 20, 24, 20, 18, 17], L: [16, 16, 16, 16, 16, 16, 31],
  M: [17, 27, 21, 21, 17, 17, 17], N: [17, 17, 25, 21, 19, 17, 17], O: [14, 17, 17, 17, 17, 17, 14], P: [30, 17, 17, 30, 16, 16, 16],
  Q: [14, 17, 17, 17, 21, 18, 13], R: [30, 17, 17, 30, 20, 18, 17], S: [15, 16, 16, 14, 1, 1, 30], T: [31, 4, 4, 4, 4, 4, 4],
  U: [17, 17, 17, 17, 17, 17, 14], V: [17, 17, 17, 17, 17, 10, 4], W: [17, 17, 17, 21, 21, 21, 10], X: [17, 17, 10, 4, 10, 17, 17],
  Y: [17, 17, 10, 4, 4, 4, 4], Z: [31, 1, 2, 4, 8, 16, 31],
  0: [14, 17, 19, 21, 25, 17, 14], 1: [4, 12, 4, 4, 4, 4, 14], 2: [14, 17, 1, 2, 4, 8, 31], 3: [31, 2, 4, 2, 1, 17, 14],
  4: [2, 6, 10, 18, 31, 2, 2], 5: [31, 16, 30, 1, 1, 17, 14], 6: [6, 8, 16, 30, 17, 17, 14], 7: [31, 1, 2, 4, 8, 8, 8],
  8: [14, 17, 17, 14, 17, 17, 14], 9: [14, 17, 17, 15, 1, 2, 12],
  "Å": [4, 10, 4, 14, 17, 17, 31, 17, 17], "Ä": [10, 0, 14, 17, 17, 31, 17, 17, 17], "Ö": [10, 0, 14, 17, 17, 17, 17, 17, 14],
  ".": [0, 0, 0, 0, 0, 12, 12], ":": [0, 12, 12, 0, 12, 12, 0], "-": [0, 0, 0, 31, 0, 0, 0], "!": [4, 4, 4, 4, 4, 0, 4],
  "/": [1, 1, 2, 4, 8, 16, 16], "?": [14, 17, 1, 2, 4, 0, 4], "+": [0, 4, 4, 31, 4, 4, 0], "'": [4, 4, 8, 0, 0, 0, 0],
  ",": [0, 0, 0, 0, 12, 4, 8], "(": [2, 4, 8, 8, 8, 4, 2], ")": [8, 4, 2, 2, 2, 4, 8], ">": [8, 4, 2, 1, 2, 4, 8],
  "<": [2, 4, 8, 16, 8, 4, 2], "=": [0, 0, 31, 0, 31, 0, 0], "*": [0, 21, 14, 31, 14, 21, 0],
};
const CHARS = Object.keys(FONT).join("");
const fontSheets = {};
function fontSheet(col) {
  if (fontSheets[col]) return fontSheets[col];
  const c = canvas(CHARS.length * 6, 9), g = c.getContext("2d");   // rows 0-1: room for Å/Ä/Ö marks
  g.fillStyle = col;
  for (let k = 0; k < CHARS.length; k++) {
    const rows = FONT[CHARS[k]], top = 9 - rows.length;
    for (let y = 0; y < rows.length; y++) for (let x = 0; x < 5; x++) if (rows[y] & (16 >> x)) g.fillRect(k * 6 + x, top + y, 1, 1);
  }
  return (fontSheets[col] = c);
}
function putStr(s, x, y, col, sc) {
  const sh = fontSheet(col);
  for (let i = 0; i < s.length; i++) {
    const k = CHARS.indexOf(s[i]);
    if (k >= 0) ctx.drawImage(sh, k * 6, 0, 5, 9, x + i * 6 * sc, y - 2 * sc, 5 * sc, 9 * sc);
  }
}
// align: 0 left, 1 centre, 2 right
function txt(s, x, y, col = "#ffffff", al = 0, sc = 1, sh = "#000000") {
  s = String(s).toUpperCase();
  const w = (s.length * 6 - 1) * sc;
  if (al === 1) x -= w / 2; else if (al === 2) x -= w;
  x = Math.round(x); y = Math.round(y);
  if (sh) putStr(s, x + sc, y + sc, sh, sc);
  putStr(s, x, y, col, sc);
}

// ============================================================ sprites (drawn in code, outlined)
const OUTLINE = "#10131c";
function finish(c, meta = {}) {
  const g = c.getContext("2d"), w = c.width, h = c.height;
  const d = g.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a), oc = hexRGB(OUTLINE);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (a[i + 3]) continue;
    if ((x > 0 && a[i - 1]) || (x < w - 1 && a[i + 7]) || (y > 0 && a[i - w * 4 + 3]) || (y < h - 1 && a[i + w * 4 + 3])) {
      o[i] = oc[0]; o[i + 1] = oc[1]; o[i + 2] = oc[2]; o[i + 3] = 255;
    }
  }
  g.putImageData(new ImageData(o, w, h), 0, 0);
  const flipped = src => { const f = canvas(w, h), fg = f.getContext("2d"); fg.translate(w, 0); fg.scale(-1, 1); fg.drawImage(src, 0, 0); return f; };
  const white = canvas(w, h), wg = white.getContext("2d");
  wg.drawImage(c, 0, 0); wg.globalCompositeOperation = "source-in"; wg.fillStyle = "#ffffff"; wg.fillRect(0, 0, w, h);
  return Object.assign({ img: c, flip: flipped(c), white, whiteFlip: flipped(white), w, h, cy: h / 2, props: [] }, meta);
}

// a side-view propeller plane facing right; fuselage centre line at meta.cy
function planeSprite(P) {
  P = Object.assign({ hh: 3, fin: 4, wingDrop: 2, cab: 0.55, engines: [], eng: "#555555", glass: "#8fe3ff", mark: null }, P);
  const pad = 2, top = Math.max(P.fin, 3) + 1, cy = pad + top + P.hh;
  const w = P.L + pad * 2 + 3, h = cy + Math.max(P.hh, P.wingDrop + 3) + pad + 1;
  const c = canvas(w, h), g = c.getContext("2d");
  const R = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(ww)), Math.max(1, Math.round(hh))); };
  const x0 = pad;
  const fl = Math.max(3, Math.round(P.L * 0.2)), fb = cy - Math.round(P.hh * 0.5);
  const wx = x0 + Math.round(P.L * 0.4), ww = Math.max(5, Math.round(P.L * 0.3));
  // far wing: a dark sliver above the fuselage
  for (let j = 1; j <= Math.max(1, Math.round(P.wingDrop / 2)); j++) R(wx + 2 + j, cy - Math.round(P.hh * 0.6) - j, ww - 3 - j * 2, 1, P.dark);
  // tail fin: vertical trailing edge, sloped leading edge
  for (let i = 0; i < fl; i++) {
    const fh = Math.round(P.fin * Math.min(1, 1.25 * (1 - i / fl)));
    if (fh > 0) { R(x0 + i, fb - fh, 1, fh + 1, P.col); R(x0 + i, fb - fh, 1, 1, P.lite); }
  }
  for (let i = 0; i < P.L; i++) {
    const u = i / (P.L - 1);
    const k = u < 0.7 ? 0.5 + 0.5 * Math.sin(u / 0.7 * Math.PI / 2) : 1 - 0.32 * ((u - 0.7) / 0.3) ** 2;
    const hh = Math.max(1, Math.round(P.hh * k));
    R(x0 + i, cy - hh, 1, hh * 2, P.col); R(x0 + i, cy - hh, 1, 1, P.lite); R(x0 + i, cy + hh - 1, 1, 1, P.dark);
  }
  R(x0 + 2, cy - 1, P.L - 6, 1, P.lite);
  // tailplane: small swept slab below the tail
  const tl = Math.max(3, Math.round(P.L * 0.18));
  R(x0 - 1, cy, tl, 1, P.wing); R(x0, cy + 1, tl - 1, 1, P.wing); if (P.hh > 2) R(x0 + 1, cy + 2, tl - 3, 1, P.dark);
  const cx0 = x0 + Math.round(P.L * P.cab), cw = Math.max(3, Math.round(P.L * 0.15)), ct = cy - Math.round(P.hh * 0.9);
  R(cx0, ct - 2, cw, 2, P.glass); R(cx0 + 1, ct - 3, Math.max(1, cw - 2), 1, P.glass); R(cx0 + cw - 2, ct - 2, 1, 1, "#ffffff");
  // near wing: a trapezoid hanging below the fuselage, lit leading edge
  const wd = P.wingDrop + 2;
  for (let j = 0; j < wd; j++) {
    const a = wx + Math.round(j * 0.8), b = wx + ww - Math.round(j * 0.4);
    R(a, cy + 1 + j, b - a, 1, j === 0 ? P.lite : P.wing); R(b - 1, cy + 1 + j, 1, 1, P.lite);
  }
  const props = [];
  const ew = Math.max(5, Math.round(P.L * 0.07)), eh = Math.max(3, Math.round(P.hh * 0.75));
  for (const f of P.engines) {
    const ex = x0 + Math.round(P.L * f), ey = cy - Math.floor(eh / 2) + 1;
    R(ex, ey, ew, eh, P.eng); R(ex, ey, ew, 1, P.lite); R(ex + ew, ey + Math.floor(eh / 2) - 1, 1, 2, P.nose);
    props.push([ex + ew + 1, ey + eh / 2, eh + 3]);
  }
  if (P.mark) { const mx = x0 + Math.round(P.L * 0.3); R(mx - 1, cy - 1, 3, 3, P.mark); R(mx, cy - 2, 1, 5, P.mark); R(mx - 2, cy, 5, 1, P.mark); }
  R(x0 + P.L - 1, cy - 1, 2, 2, P.nose);
  props.unshift([x0 + P.L + 1, cy, P.hh * 2 + 4]);
  return finish(c, { cy, props });
}

// ships face left, meta.base = the waterline row
function shipSprite(kind) {
  const S = { boat: { L: 36, H: 18, hull: 5 }, destroyer: { L: 72, H: 26, hull: 7 }, battleship: { L: 196, H: 50, hull: 12 },
    carrier: { L: 224, H: 44, hull: 10 }, sub: { L: 172, H: 28, hull: 9 } }[kind];
  const w = S.L + 4, h = S.H + 2, c = canvas(w, h), g = c.getContext("2d");
  const R = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); };
  const base = h - 2, x0 = 2, deck = base - S.hull;
  if (kind === "sub") {
    // a long cigar hull lying low in the water, conning tower amidships
    for (let i = 0; i < S.L; i++) {
      const u = i / S.L, e = Math.min(1, Math.min(u / 0.1, (1 - u) / 0.16));
      const top = deck + Math.round((1 - Math.sqrt(e)) * S.hull * 0.7), bot = base - Math.round((1 - e) * S.hull * 0.3);
      R(x0 + i, top, 1, bot - top + 1, "#3a4350"); R(x0 + i, top, 1, 1, "#7a8594");
    }
    R(x0 + 8, deck + 2, S.L - 30, 1, "#2a313b");
    R(x0 + 72, deck - 12, 20, 12, "#4a5360"); R(x0 + 72, deck - 12, 20, 1, "#8f9aa8"); R(x0 + 74, deck - 9, 4, 1, "#1e2a3a"); R(x0 + 80, deck - 9, 4, 1, "#1e2a3a");
    R(x0 + 78, deck - 18, 1, 6, "#2e3138"); R(x0 + 84, deck - 16, 1, 4, "#2e3138"); R(x0 + 77, deck - 18, 3, 1, "#2e3138");
    R(x0 + S.L - 8, deck - 4, 2, 5, "#2e3138"); R(x0 + S.L - 12, deck - 1, 8, 1, "#2e3138");
    return finish(c, { base, cy: base - S.hull });
  }
  for (let i = 0; i < S.L; i++) {
    const u = i / S.L;
    const top = deck - (u < 0.14 ? Math.round((0.14 - u) / 0.14 * 3) : 0) + (u > 0.95 ? 1 : 0);
    const bot = base - (u < 0.06 ? Math.round((0.06 - u) / 0.06 * S.hull * 0.7) : 0);
    R(x0 + i, top, 1, bot - top + 1, "#4d555f"); R(x0 + i, top, 1, 1, "#8f98a2");
    if (bot >= base - 1) R(x0 + i, base - 1, 1, 2, "#7a3a32");
  }
  const sup = "#7d858e", dark = "#3a3f46", win = "#1e2a3a";
  if (kind === "boat") {
    R(x0 + 14, deck - 5, 11, 5, sup); R(x0 + 15, deck - 4, 9, 1, win); R(x0 + 20, deck - 11, 1, 6, dark);
    R(x0 + 5, deck - 2, 4, 2, "#5d646c"); R(x0 + 1, deck - 2, 4, 1, dark); R(x0 + 28, deck - 2, 3, 2, "#5d646c");
  } else if (kind === "destroyer") {
    R(x0 + 16, deck - 8, 13, 8, sup); R(x0 + 17, deck - 7, 11, 2, win); R(x0 + 22, deck - 15, 1, 7, dark); R(x0 + 18, deck - 13, 9, 1, dark);
    R(x0 + 34, deck - 9, 6, 9, "#454b53"); R(x0 + 34, deck - 10, 6, 1, "#1a1c20");
    R(x0 + 44, deck - 7, 6, 7, "#454b53"); R(x0 + 44, deck - 8, 6, 1, "#1a1c20");
    R(x0 + 6, deck - 3, 6, 3, "#5d646c"); R(x0 + 1, deck - 3, 6, 1, dark);
    R(x0 + 58, deck - 3, 6, 3, "#5d646c"); R(x0 + 63, deck - 3, 6, 1, dark);
  } else if (kind === "carrier") {
    R(x0 - 2, deck - 5, S.L + 2, 4, "#5f5a52"); R(x0 - 2, deck - 5, S.L + 2, 1, "#9a9284"); R(x0 - 2, deck - 2, S.L + 2, 1, "#2e2c2a");
    for (let i = 0; i < S.L - 20; i += 12) R(x0 + 8 + i, deck - 4, 6, 1, "#e8e0d0");
    R(x0 + 150, deck - 22, 16, 17, sup); R(x0 + 150, deck - 22, 16, 1, "#a9b1ba"); R(x0 + 152, deck - 19, 12, 2, win); R(x0 + 152, deck - 14, 12, 1, win);
    R(x0 + 157, deck - 32, 2, 10, dark); R(x0 + 152, deck - 29, 12, 1, dark); R(x0 + 154, deck - 26, 8, 1, dark);
    R(x0 + 167, deck - 18, 7, 13, "#454b53"); R(x0 + 167, deck - 19, 7, 1, "#1a1c20");
    for (let i = 0; i < 16; i++) R(x0 + 12 + i * 13, base - 5, 2, 1, "#2b3036");
  } else {
    R(x0 + 60, deck - 8, 82, 8, "#6f7780"); R(x0 + 60, deck - 8, 82, 1, "#9aa3ad");
    R(x0 + 88, deck - 26, 22, 18, sup); R(x0 + 88, deck - 26, 22, 1, "#a9b1ba");
    R(x0 + 90, deck - 23, 18, 2, win); R(x0 + 90, deck - 17, 18, 1, win);
    R(x0 + 92, deck - 30, 14, 4, "#6f7780"); R(x0 + 98, deck - 40, 2, 10, dark); R(x0 + 93, deck - 36, 12, 1, dark);
    R(x0 + 118, deck - 20, 11, 12, "#454b53"); R(x0 + 118, deck - 22, 11, 2, "#1a1c20");
    R(x0 + 70, deck - 12, 8, 4, "#6f7780"); R(x0 + 130, deck - 12, 8, 4, "#6f7780");
    for (let i = 0; i < 14; i++) R(x0 + 14 + i * 13, base - 6, 2, 1, "#2b3036");   // portholes
  }
  return finish(c, { base, cy: base - S.hull });
}

function podSprite(main, dark) {
  const c = canvas(11, 9), g = c.getContext("2d");
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  R(2, 1, 7, 7, main); R(1, 2, 9, 5, main); R(2, 6, 7, 1, dark); R(1, 5, 9, 1, dark);
  R(3, 2, 2, 1, "#ffffff"); R(4, 3, 3, 1, "#ffffff"); R(4, 4, 1, 1, "#ffffff");
  return finish(c);
}
function medalSprite() {
  const c = canvas(9, 9), g = c.getContext("2d");
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  R(2, 1, 5, 7, "#e8b43a"); R(1, 2, 7, 5, "#e8b43a"); R(3, 2, 3, 5, "#ffe58a"); R(2, 3, 5, 3, "#ffe58a"); R(4, 3, 1, 3, "#b57a1a"); R(3, 4, 3, 1, "#b57a1a");
  return finish(c);
}
function circleSpans(g, cx, cy, r) {
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.5)); g.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
}
function cloudSprite(w, h, top, bot, seed) {
  const r = rng(seed), c = canvas(w, h), g = c.getContext("2d"), blobs = [];
  const n = 3 + Math.floor(w / 14);
  for (let i = 0; i < n; i++) {
    const rr = Math.round(h * (0.22 + r() * 0.28));
    const x = Math.round(rr + r() * (w - rr * 2)), y = Math.round(h - rr - 1 - r() * (h * 0.35) * Math.sin(Math.PI * x / w));
    blobs.push([x, y, rr]);
  }
  blobs.push([Math.round(w * 0.5), Math.round(h * 0.45), Math.round(h * 0.38)]);
  g.fillStyle = bot; for (const [x, y, rr] of blobs) circleSpans(g, x, y, rr);
  g.fillStyle = top; for (const [x, y, rr] of blobs) circleSpans(g, x, y - 2, Math.max(1, rr - 1));
  return c;
}

const SPR = {};
function buildSprites() {
  const blue = { col: "#3d6fc4", lite: "#a2c8f8", dark: "#22427a", nose: "#f2c84b", glass: "#7fe6ff", wing: "#2b5296" };
  const steel = { col: "#8c96a6", lite: "#dfe6ef", dark: "#4e5664", nose: "#ff8a2a", glass: "#7fe6ff", wing: "#646e7e" };
  SPR.player0 = planeSprite(Object.assign({ L: 22, hh: 3, fin: 5, wingDrop: 3, mark: "#ffffff" }, blue));
  SPR.player1 = planeSprite(Object.assign({ L: 27, hh: 4, fin: 6, wingDrop: 4, cab: 0.5, mark: "#ffd24a" }, steel));
  SPR.life0 = planeSprite(Object.assign({ L: 9, hh: 1, fin: 2, wingDrop: 0 }, blue));
  SPR.life1 = planeSprite(Object.assign({ L: 9, hh: 1, fin: 2, wingDrop: 0 }, steel));
  const gold = { col: "#d9a531", lite: "#ffe08a", dark: "#8a6212", nose: "#c3412f", glass: "#7fe6ff", wing: "#b0841f" };
  const night = { col: "#4a4060", lite: "#9a8fb8", dark: "#221c2e", nose: "#ff4a3a", glass: "#ffb07a", wing: "#342c46", eng: "#2a2434" };
  SPR.player2 = planeSprite(Object.assign({ L: 24, hh: 3, fin: 5, wingDrop: 3, cab: 0.55, mark: "#ffffff" }, gold));
  SPR.player3 = planeSprite(Object.assign({ L: 28, hh: 4, fin: 6, wingDrop: 4, cab: 0.6, engines: [0.42], mark: "#ff4a3a" }, night));
  SPR.life2 = planeSprite(Object.assign({ L: 9, hh: 1, fin: 2, wingDrop: 0 }, gold));
  SPR.life3 = planeSprite(Object.assign({ L: 9, hh: 1, fin: 2, wingDrop: 0 }, night));
  SPR.wing = planeSprite({ L: 15, hh: 2, fin: 3, wingDrop: 1, col: "#4f9a68", lite: "#a6dcb4", dark: "#2c5a3b", nose: "#f2c84b", glass: "#7fe6ff", wing: "#356b47" });
  const olive = { col: "#7d8b5a", lite: "#b9c68c", dark: "#485334", nose: "#3a3a3a", glass: "#cfe8ff", wing: "#56623d", mark: "#e8d24a" };
  const red = { col: "#c3412f", lite: "#f59a7c", dark: "#76231a", nose: "#ffd24a", glass: "#cfe8ff", wing: "#8f2c20", mark: "#ffffff" };
  SPR.fighter = planeSprite(Object.assign({ L: 18, hh: 3, fin: 4, wingDrop: 2 }, olive));
  SPR.red = planeSprite(Object.assign({ L: 18, hh: 3, fin: 4, wingDrop: 2 }, red));
  const heavy = { L: 28, hh: 4, fin: 6, wingDrop: 3, engines: [0.5], eng: "#58646f" };

// ============================================================ shooting helpers

function aim(x, y) { const p = G.p; return Math.atan2(p.y - y, p.x - x); }

// ============================================================ effects

  if (size >= 2) for (let i = 0; i < size * 3; i++) G.fx.push({ k: "deb", x, y, vx: rand(-1.5, 1.5), vy: rand(-2.5, -0.5), t: 0, life: 90 });
  if (size >= 3) { G.fx.push({ k: "ring", x, y, t: 0, life: 18, r: size * 8 }); G.shake = Math.max(G.shake, size * 3); }
  if (!quiet) sfx(size >= 3 ? "bigboom" : "boom");
  if (y > WATER - 12) splash(x, size, true);
}
function spark(x, y) { for (let i = 0; i < 2; i++) G.fx.push({ k: "spark", x, y, vx: rand(-1.5, 0.5), vy: rand(-1, 1), t: 0, life: 6 + rand(5) }); }
function smoke(x, y, big) { G.fx.push({ k: "smoke", x, y, vx: -0.6 + rand(-0.2, 0.2), vy: -0.25, t: 0, life: 30 + rand(20), r: big ? 3 : 2 }); }
function splash(x, size, quiet) {

}
function dropPod(x, y, orange) { G.items.push({ k: "pod", x, y, vx: -0.6, t: 0, blue: !orange && chance(1 / 9) }); }
// boats, destroyers and the big planes (heavy fighters, bombers) always give two orange pods
const TWO_PODS = new Set(["boat", "destroyer", "heavy", "bomber"]);
function dropTwoPods(x, y) { dropPod(x - 6, y - 3, true); dropPod(x + 6, y + 3, true); }
function dropMedals(x, y, n) { for (let i = 0; i < n; i++) G.items.push({ k: "medal", x: x + rand(-10, 10), y: y + rand(-6, 6), vx: rand(-1, 0.2), vy: rand(-1.6, -0.4), t: 0 }); }

// ============================================================ enemies
function updEnemy(e) {
  if (e.warn > 0) { e.warn--; return; }
  e.t++;
  if (e.flash > 0) e.flash--;
  const p = G.p;
  switch (e.type) {
    case "fighter":
      e.x += e.vx; e.y = e.y0 + e.amp * Math.sin(e.t * e.freq + e.ph);
      if (e.willFire && e.t === e.ft && okFire(e.x, e.y)) shoot(e.x - 8, e.y, aim(e.x, e.y), bspd());
      break;
    case "squad":
      e.x += e.vx; e.y = e.y0 + e.amp * Math.sin((W - e.x) * 0.032);
      if (e.willFire && e.t === e.ft + 40 && okFire(e.x, e.y)) shoot(e.x - 8, e.y, aim(e.x, e.y), bspd());
      break;
    case "diver":
      if (e.t < 40) e.x += e.vx;
      else {
        if (p.alive) e.vy = clamp(e.vy + clamp(p.y - e.y, -1, 1) * 0.08, -1.6, 1.6);
        e.vx = Math.max(-3.3, e.vx - 0.04); e.x += e.vx; e.y += e.vy;
      }
      if (e.t === 30 && e.willFire && okFire(e.x, e.y)) shoot(e.x - 8, e.y, aim(e.x, e.y), bspd());
      break;
    case "looper": {
      const ox = e.x, oy = e.y, R = 24;
      if (!e.lp && e.x < e.lx) { e.lp = 1; e.cx = e.x; e.cyy = e.y - R; e.la = Math.PI / 2; }
      if (e.lp === 1) {
        e.la += 0.07;
        e.x = e.cx + R * Math.cos(e.la) - (e.la - Math.PI / 2) * 2.2; e.y = e.cyy + R * Math.sin(e.la);
        if (e.la > Math.PI * 1.5 && !e.fired) { e.fired = true; if (okFire(e.x, e.y)) shoot(e.x - 6, e.y, aim(e.x, e.y), bspd()); }
        if (e.la >= Math.PI * 2.5) { e.lp = 2; e.y = e.cyy + R; }
      } else e.x += e.lp ? -2.4 : e.vx;
      e.dvx = e.x - ox; e.dvy = e.y - oy;
      break;
    }
    case "rear":
      e.x += e.vx; e.y = e.y0 + 10 * Math.sin(e.t * 0.04);
      if (e.t === 60 && okFire(e.x, e.y)) shoot(e.x + 8, e.y, aim(e.x, e.y), bspd());
      break;
    case "heavy":
      if (e.t < 280) e.x += ((W - 72) - e.x) * 0.035;
      else { e.lv = (e.lv || 0) - 0.04; e.x += e.lv; }
      e.y = e.y0 + 10 * Math.sin(e.t * 0.03);
      if (e.t % 75 === 40 && e.t < 300 && okFire(e.x, e.y)) { const a = aim(e.x, e.y); for (let k = -1; k <= 1; k++) shoot(e.x - 14, e.y, a + k * 0.22, bspd() * 0.9); }
      break;
    case "bomber":
      e.x += e.vx; e.y = e.y0 + 5 * Math.sin(e.t * 0.02);
      if (e.t % 45 === 0) {
        const tu = (e.t / 45) % 2 ? [-14, -8] : [10, 8], tx = e.x + tu[0], ty = e.y + tu[1];
        if (okFire(tx, ty)) { shoot(tx, ty, aim(tx, ty), bspd()); if (D() >= 2) shoot(tx, ty, aim(tx, ty) + 0.2, bspd()); }
      }
      if (e.hp < e.maxhp / 2 && e.t % 4 === 0) smoke(e.x + 8, e.y - 2, true);
      break;
    case "boat":
      e.x += e.vx;
      if (e.t % 110 === 60 && okFire(e.x - 8, e.y - 10)) shoot(e.x - 8, e.y - 10, aim(e.x - 8, e.y - 10), bspd() * 0.9);
      break;
    case "destroyer":
      e.x += e.vx;
      if (e.t % 55 === 30) { const gx = e.x + ((e.t / 55) % 2 < 1 ? -26 : 24), gy = e.y - 11; if (okFire(gx, gy)) { const a = aim(gx, gy); shoot(gx, gy, a, bspd()); shoot(gx, gy, a - 0.15, bspd()); } }
      if (e.t % 9 === 0) G.fx.push({ k: "smoke", x: e.x + 1, y: e.y - 18, vx: -0.7, vy: -0.3, t: 0, life: 40, r: 2, light: true });
      break;
  }
  if ((e.x < -70 && e.type !== "rear") || e.x > W + 90 || e.y < -40 || e.y > H + 30) {
    e.dead = true; e.gone = true;
    if (e.sq) e.sq.escaped = true;
  }
}

function hitEnemy(e, dmg, x, y) {
  if (e.dead || e.warn > 0) return;
  e.hp -= dmg; e.flash = 3; spark(x, y);
  if (e.hp <= 0) killEnemy(e); else sfx("hit");
}
function killEnemy(e, silent) {
  e.dead = true;
  addScore(e.score, e.x, ecy(e) - 6);
  const s = SPR[e.spr];
  if (e.ground) {
    explosion(e.x, e.y - 6, e.type === "destroyer" ? 3 : 2, silent);
    G.fx.push({ k: "sink", s, x: e.x, y: e.y, t: 0, life: 160 });
    if (e.type === "destroyer") dropMedals(e.x, e.y - 14, 3);
    else dropMedals(e.x, e.y - 12, 1);
  } else if (e.type === "bomber") {
    explosion(e.x, e.y, 3, silent);
    G.fx.push({ k: "wreck", s, x: e.x, y: e.y, vx: -0.4, vy: 0, ang: 0, va: -0.006, t: 0, life: 999, flip: true });
    dropMedals(e.x, e.y, 4);
  } else {
    if (chance(0.4)) { explosion(e.x, e.y, 1, silent); G.fx.push({ k: "wreck", s, x: e.x, y: e.y, vx: e.faceRight ? 1 : (e.vx || -1) * 0.6, vy: -0.4, ang: 0, va: e.faceRight ? 0.03 : -0.03, t: 0, life: 999, flip: !e.faceRight }); }
    else explosion(e.x, e.y, e.type === "heavy" ? 2 : 1, silent);
  }
  if (TWO_PODS.has(e.type)) dropTwoPods(e.x, e.ground ? e.y - 20 : ecy(e));
  else if (e.red) dropPod(e.x, ecy(e));
  if (e.sq) {
    e.sq.left--;
    if (e.sq.left === 0 && !e.sq.escaped) { dropPod(e.x, e.y); addScore(1000, e.x, e.y - 14); }
  }
}

// ============================================================ bosses

const BOSS_OF = ["fortress", "battleship", "fortress", "battleship", "carrier", "gunship", "sub"];

  } else if (kind === "battleship") {

              { ox: -24, oy: -22, kind: "aa" }, { ox: 36, oy: -22, kind: "aa" }, { ox: -86, oy: -17, kind: "aa" }]
        .map(q => q.kind === "main" ? part(q, 30, 6, 4) : part(q, 12, 4, 3)) };
  } else if (kind === "carrier") {
    b = { x: W + 125, y: WATER, hp: 300, core: { ox: 46, oy: -22, hw: 9, hh: 11 }, body: { ox: 0, oy: -8, hw: 110, hh: 7 },
      parts: [{ ox: -80, oy: -16, kind: "cat" }, { ox: -40, oy: -16, kind: "cat" },
              { ox: -100, oy: -17, kind: "aa" }, { ox: -12, oy: -17, kind: "aa" }, { ox: 22, oy: -17, kind: "aa" }, { ox: 84, oy: -17, kind: "aa" }]
        .map(q => q.kind === "cat" ? part(q, 34, 8, 3) : part(q, 14, 4, 3)) };

      parts: [{ ox: -50, oy: -11, kind: "main" }, { ox: 40, oy: -11, kind: "main" },
              { ox: 14, oy: -10, kind: "hatch" }, { ox: 24, oy: -10, kind: "hatch" }, { ox: 62, oy: -10, kind: "hatch" }]

  b.hp = Math.round(b.hp * hpMul); b.max = b.hp;

// while a guard part stands, the hull only takes part of the damage
function guarded(b) {

function bossDead() {

// a shell lobbed in an arc that comes down on (tx, ty) after T frames
function lob(x, y, tx, ty, T) { const g = 0.05; G.eb.push({ x, y, vx: (tx - x) / T, vy: (ty - y - 0.5 * g * T * T) / T, g, r: 2, t: 0 }); }
function missile(x, y) { G.eb.push({ x, y, vx: -0.4, vy: -1.6, r: 2, t: 0, home: 110, sp: 1.5 + D() * 0.05, msl: true }); }

function updAirBoss(b) {
  if (b.dying) {
    b.dying++;
    if (b.dying % 6 === 0) explosion(b.x + rand(-60, 60), b.y + rand(-10, 10), 2, b.dying % 12 !== 0);
    if (b.dying > 140) { b.vy += 0.03; b.y += b.vy; b.ang -= 0.0025; b.x -= 0.3; if (b.dying % 2 === 0) smoke(b.x + rand(-50, 50), b.y, true); }
    if (b.dying > 140 && b.y > WATER - 6) { splash(b.x, 6); splash(b.x - 40, 4, true); splash(b.x + 40, 4, true); explosion(b.x, WATER - 8, 4); G.boss = null; stageClear(); }
    return;
  }
  for (const q of b.parts) if (!q.alive && b.t % 6 === 0) smoke(b.x + q.ox, b.y + q.oy);
  if (b.kind === "fortress") {
    const tx = W - 92;
    if (b.x > tx + 1) b.x -= 0.9; else b.x = tx + 8 * Math.sin(b.t * 0.012);
    b.y = 80 + 30 * Math.sin(b.t * 0.009);
    for (const q of b.parts) {
      if (!q.alive || --q.cd > 0) continue;
      q.cd = Math.max(40, 85 - D() * 6) + rand(30);
      const px = b.x + q.ox, py = b.y + q.oy;
      if (okFire(px, py)) { const a = aim(px, py); for (let k = -1; k <= 1; k++) shoot(px, py, a + k * 0.13, bspd()); }
    }
    if (b.t % 50 === 0 && okFire(b.x - 66, b.y)) shoot(b.x - 66, b.y, aim(b.x - 66, b.y), bspd() * 1.2);
    if (b.hp < b.max * 0.6 && b.t % 140 === 0) for (let i = 0; i < 14; i++) shoot(b.x, b.y, i / 14 * TAU + b.t * 0.01, bspd() * 0.8);
    if (b.t % 260 === 130) for (let k = 0; k < 2; k++) enemy({ type: "fighter", x: b.x - 20, y: b.y + 14 + k * 10, vx: -2.2 });
    return;

    shoot(nx, b.y, a, bspd() * 0.7); shoot(nx, b.y, a + Math.PI, bspd() * 0.7);
  }
  if (b.hp < b.max * 0.6 && b.t % 80 === 0) G.eb.push({ x: b.x - 10, y: b.y + 14, vx: -0.6, vy: 0.35, r: 3, t: 0 });
  if (b.t % 300 === 150) for (let k = 0; k < 2; k++) enemy({ type: "fighter", x: b.x - 20, y: b.y + 20 + k * 10, vx: -2.4, red: k === 1 && chance(0.3) });
}

function updSeaBoss(b) {
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) explosion(b.x + rand(-90, 90), b.y + b.sink - rand(4, 30), 2, b.dying % 10 !== 0);
    if (b.dying > 100) { b.sink += 0.22; b.ang = Math.min(0.06, b.ang + 0.0006); if (b.dying % 3 === 0) splash(b.x + rand(-90, 90), 1, true); if (b.dying % 2 === 0) smoke(b.x + rand(-60, 60), b.y - 30 + b.sink, true); }
    if (b.sink > 56) { G.boss = null; stageClear(); }

  }
  const tx = W - (b.kind === "carrier" ? 118 : b.kind === "sub" ? 100 : 108);
  if (b.x > tx + 1 && b.t < 500) b.x -= 0.7; else b.x = tx + 10 * Math.sin(b.t * 0.01);

      if (b.sc % 6 === 0) G.fx.push({ k: "drop", x: b.x - 6 + rand(-3, 3), y: WATER - 1, vx: -0.4, vy: -1, t: 0, life: 30 });

    } else if (b.st === "rise") { b.sink = Math.max(0, b.sink - 0.6); if (b.sink <= 0) { b.st = "up"; b.sc = 0; splash(b.x, 3); } }

    if (--q.cd > 0 || !up) continue;
    if (q.kind === "main") { q.cd = Math.max(70, 115 - D() * 6) + rand(30); if (okFire(px, py)) { const a = aim(px, py), n = b.kind === "sub" ? 1 : 2; for (let k = -n; k <= n; k++) shoot(px, py - 2, a + k * 0.16, bspd() * 0.85, 3); } }
    else if (q.kind === "aa") { q.cd = Math.max(32, 52 - D() * 3) + rand(20); if (okFire(px, py)) shoot(px, py - 2, aim(px, py), bspd() * 1.25); }
    else if (q.kind === "cat") {   // launches a fighter off the deck
      q.cd = Math.max(140, 220 - D() * 8) + rand(40);

      G.fx.push({ k: "smoke", x: px, y: py - 2, vx: -0.6, vy: -0.3, t: 0, life: 30, r: 2, light: true });
    } else if (q.kind === "hatch") { q.cd = Math.max(110, 170 - D() * 6) + rand(50); if (G.p && G.p.alive) missile(px, py - 3); }
  }
  if (!up) return;
  if (b.kind === "battleship") {
    const mainsLeft = b.parts.some(q => q.kind === "main" && q.alive);
    if ((!mainsLeft || b.hp < b.max * 0.5) && b.t % 160 < 60 && b.t % 6 === 0 && okFire(b.x, b.y - 36)) shoot(b.x, b.y - 36, aim(b.x, b.y - 36) + 0.5 * Math.sin(b.t * 0.2), bspd());
    if (b.t % 300 === 150) for (let k = 0; k < 2; k++) enemy({ type: "diver", x: b.x - 30 + k * 20, y: b.y - 22, vx: -1.5 });
  } else if (b.kind === "carrier") {
    const ix = b.x + 46, iy = b.y - 30;
    if (b.t % 130 === 65 && okFire(ix, iy)) { const a = aim(ix, iy); for (let k = -3; k <= 3; k++) shoot(ix, iy, a + k * 0.12, bspd() * 0.9); }
    if ((b.hp < b.max * 0.5 || !guarded(b)) && b.t % 110 === 0 && G.p && G.p.alive)
      for (let k = 0; k < 4; k++) lob(b.x + rand(-60, 60), b.y - 16, G.p.x + rand(-40, 40), G.p.y + rand(-20, 20), 80 + k * 8);
  } else if (b.kind === "sub") {
    const cx = b.x - 6, cy = b.y + b.sink - 22;
    if (b.sc > 60 && b.t % 18 === 0 && b.t % 180 < 90 && okFire(cx, cy)) shoot(cx, cy, aim(cx, cy), bspd() * 1.1);
  }
}
function updBoss() {
  const b = G.boss;
  if (!b) return;
  b.t++;
  if (b.flash > 0) b.flash--;
  for (const q of b.parts) if (q.flash > 0) q.flash--;
  if (isAir(b)) updAirBoss(b); else updSeaBoss(b);
}
// returns true if the bullet was used up
function hitBoss(x, y, w, h, dmg) {
  const b = G.boss;
  if (!b || b.dying || b.x > W + 30) return false;
  if (b.kind === "sub" && b.sink > 10) return false;
  const dy = b.sink;
  const inBox = (q) => Math.abs(x - (b.x + q.ox)) < q.hw + w / 2 && Math.abs(y - (b.y + dy + q.oy)) < q.hh + h / 2;
  for (const q of b.parts) {
    if (q.alive && inBox(q)) {
      q.hp -= dmg; q.flash = 3; spark(x, y);
      if (q.hp <= 0) { q.alive = false; explosion(b.x + q.ox, b.y + dy + q.oy, 2); addScore(2000, b.x + q.ox, b.y + dy + q.oy - 8); }
      else sfx("hit");
      return true;
    }
  }
  const gd = guarded(b);
  let mul = 0;
  if (b.core && inBox(b.core)) mul = gd ? 0.5 : 1;
  else if (inBox(b.body)) mul = isAir(b) ? (gd ? 0.5 : 1) : (gd ? 0.2 : 0.5);
  else return false;
  b.hp -= dmg * mul; b.flash = 2; spark(x, y); sfx("hit");
  if (b.hp <= 0) bossDead();
  return true;
}
function bossTouches(px, py) {
  const b = G.boss;
  if (!b || b.dying) return false;
  const boxes = b.core ? [b.body, b.core] : [b.body];
  return boxes.some(q => Math.abs(px - (b.x + q.ox)) < q.hw + 3 && Math.abs(py - (b.y + b.sink + q.oy)) < q.hh + 2);
}

// ============================================================ player
function activatePower() {
  const p = G.p;
  if (!p || !p.alive || p.sel < 0) { sfx("nope"); return; }
  const s = SLOTS[p.sel];
  if (p.lv[s.k] >= smax(s)) { sfx("nope"); return; }
  if (s.k === "shield") p.lv.shield = smax(s); else p.lv[s.k]++;
  p.sel = -1;
  sfx("power");
  G.fx.push({ k: "pop", text: slotName(s) + "!", x: p.x, y: p.y - 12, t: 0, life: 50, col: "#ffd24a" });
}
function wingPos(p, i) {
  const n = p.trail.length, k = n - 1 - 14 * (i + 1);
  const q = k >= 0 ? p.trail[k] : p.trail[0] || p;
  return { x: q.x - 2, y: q.y + (i ? -0 : 0) };
}
// kinds: b/hb light/heavy gun, r/hr rear, rail (FALK) / c (BJÖRN) piercing, bomb/hbomb
function pbullet(x, y, vx, vy, kind, dmg) {
  const o = { x, y, vx, vy, k: kind, dmg, w: 6, h: 2 };
  if (kind === "hb" || kind === "hr") Object.assign(o, { w: 8, h: 3 });
  if (kind === "rail") Object.assign(o, { w: 12, h: 2, pierce: true, hit: new Set() });
  if (kind === "c") Object.assign(o, { w: 10, h: 5, pierce: true, hit: new Set() });
  if (kind === "bomb" || kind === "hbomb") Object.assign(o, { bomb: PL().bomb, w: kind === "hbomb" ? 7 : 5, h: kind === "hbomb" ? 5 : 4 });
  G.pb.push(o);
}
function updPlayer() {
  const p = G.p;
  if (!p.alive) {
    if (G.mode !== "play") return;
    if (--p.dead <= 0) {
      if (G.lives <= 0) { toOver(); return; }
      G.lives--;
      const lv = p.lv;   // dying costs one step of every upgrade, not all of them
      G.p = newPlayer();
      for (const k in lv) G.p.lv[k] = Math.max(0, lv[k] - 1);
    }
    return;
  }
  const ox = p.x, oy = p.y;
  if (p.entering > 0) { p.entering--; p.x += (60 - p.x) * 0.06; p.y += (95 - p.y) * 0.04; }
  else {
    const sp = PL().spd + p.lv.speed * PL().spdUp;
    let dx = inp.x, dy = inp.y;
    const mag = Math.hypot(dx, dy);
    if (mag > 1) { dx /= mag; dy /= mag; }
    p.x += dx * sp + tdx; p.y += dy * sp + tdy;
    p.x = clamp(p.x, 10, W - 16); p.y = clamp(p.y, TOP + 6, PF_BOT - 7);
  }
  tdx = tdy = 0;
  if (p.x !== ox || p.y !== oy || !p.trail.length) { p.trail.push({ x: p.x, y: p.y }); if (p.trail.length > 64) p.trail.shift(); }
  if (p.inv > 0) p.inv--;
  p.cool--; p.ccool--; p.bcool--; p.rcool--;
  if (inp.fire) {
    const P = PL(), gn = P.gun, sp = gn.sp;
    if (p.cool <= 0) {
      p.cool = p.lv.twin >= 5 ? gn.cool3 - 1 : p.lv.twin >= 3 ? gn.cool3 : gn.cool;
      pbullet(p.x + 12, p.y - 2, sp, 0, gn.k, gn.dmg); pbullet(p.x + 12, p.y + 2, sp, 0, gn.k, gn.dmg);
      if (p.lv.twin >= 1) { const v = gn.spread[0]; pbullet(p.x + 10, p.y - 1, sp * 0.97, -v, gn.k, gn.dmg); pbullet(p.x + 10, p.y + 1, sp * 0.97, v, gn.k, gn.dmg); }
      if (p.lv.twin >= 2) { const v = gn.spread[1]; pbullet(p.x + 8, p.y - 1, sp * 0.9, -v, gn.k, gn.dmg); pbullet(p.x + 8, p.y + 1, sp * 0.9, v, gn.k, gn.dmg); }
      if (p.lv.twin >= 4) { const v = gn.spread[1] * 1.5; pbullet(p.x + 6, p.y - 1, sp * 0.85, -v, gn.k, gn.dmg); pbullet(p.x + 6, p.y + 1, sp * 0.85, v, gn.k, gn.dmg); }
      for (let i = 0; i < p.lv.wing; i++) {
        const w = wingPos(p, i); pbullet(w.x + 9, w.y, sp, 0, gn.k, gn.dmg);
        if (p.lv.twin >= 2) { pbullet(w.x + 8, w.y, sp * 0.95, -gn.spread[0] * 1.2, gn.k, gn.dmg); pbullet(w.x + 8, w.y, sp * 0.95, gn.spread[0] * 1.2, gn.k, gn.dmg); }
      }
      G.fx.push({ k: "muzzle", x: p.x + 13, y: p.y, t: 0, life: 2 });
      sfx(P.shot);
    }
    if (p.lv.cannon > 0 && p.ccool <= 0) {
      const c = P.cannon;
      const cl = p.lv.cannon;
      p.ccool = Math.round(c.cool[Math.min(3, cl)] * (cl >= 5 ? 0.6 : cl >= 4 ? 0.78 : 1));
      pbullet(p.x + 12, p.y, c.sp, 0, c.k, c.dmg);
      if (cl >= 5) { pbullet(p.x + 11, p.y - 3, c.sp, -0.35, c.k, c.dmg); pbullet(p.x + 11, p.y + 3, c.sp, 0.35, c.k, c.dmg); }
      for (let i = 0; i < p.lv.wing; i++) { const w = wingPos(p, i); pbullet(w.x + 9, w.y, c.sp, 0, c.k, c.dmg); }
      sfx(c.k === "rail" ? "rail" : "cannon");
    }
    if (p.lv.bomb > 0 && p.bcool <= 0) {
      const bm = P.bomb;
      const bl = p.lv.bomb, v = P.bombV;
      p.bcool = Math.round(bm.cool[Math.min(2, bl)] * (bl >= 4 ? 0.6 : bl >= 3 ? 0.8 : 1));
      pbullet(p.x, p.y + 4, v[0], v[1], bm.k);
      if (bl >= 2) pbullet(p.x - 4, p.y + 4, v[2], v[3], bm.k);
      if (bl >= 3) pbullet(p.x + 4, p.y + 4, v[0] * 1.5, v[1] * 0.8, bm.k);
      sfx("bomb");
    }
    if (p.lv.rear > 0 && p.rcool <= 0) {
      const r = P.rear, v = P.rearV, rl = p.lv.rear;
      p.rcool = Math.round(r.cool * (rl >= 3 ? 0.7 : 1));
      pbullet(p.x - 10, p.y, -6, 0, r.k, r.dmg);
      if (rl >= 2) { pbullet(p.x - 9, p.y - 1, -5.2, -v, r.k, r.dmg); pbullet(p.x - 9, p.y + 1, -5.2, v, r.k, r.dmg); }
      if (rl >= 4) { pbullet(p.x - 6, p.y - 3, -2.5, -4.5, r.k, r.dmg); pbullet(p.x - 6, p.y + 3, -2.5, 4.5, r.k, r.dmg); }
    }
  }
  if (inp.powerHit) activatePower();
}
function playerHit() {
  const p = G.p;
  if (!p.alive || p.inv > 0 || p.entering > 0 || G.god) return;
  if (p.lv.shield > 0) {
    p.lv.shield--; p.inv = 60; sfx("shield");
    G.eb = G.eb.filter(b => Math.hypot(b.x - p.x, b.y - p.y) > 24);
    return;
  }
  explosion(p.x, p.y, 3); sfx("die");
  G.shake = 14; p.alive = false; p.dead = 110;
  dropPod(p.x, p.y);
}

// ============================================================ flow
function startGame() {
  audioInit();
  Object.assign(G, { score: 0, lives: DF().lives, nextLife: 30000, stage: 0, loop: 0, mode: "play", paused: false, unlockMsg: "" });
  G.p = newPlayer();
  startStage();
  sfx("start");
}
function startStage() {
  G.en = []; G.eb = []; G.pb = []; G.items = []; G.boss = null;
  G.st = 0; G.pt = 0; G.phase = "intro";
  buildStage();
  setTheme(G.stage);
  music(stageSong(), TRANSPOSE[G.stage]);
}
function stageClear() {
  G.phase = "clear"; G.pt = 0;
  G.bonus = 10000 * (G.stage + 1) * (G.loop + 1);
  addScore(G.bonus, 0, 0, false);
  const was = G.cleared, now = G.loop ? NSTAGE : G.stage + 1;
  G.unlockMsg = "";
  if (now > was) {
    G.cleared = now; store.set("cleared", now);
    const nu = PLANES.filter(P => P.unlock && P.unlock > was && P.unlock <= now).map(P => P.name);
    if (nu.length) G.unlockMsg = "NEW PLANE UNLOCKED: " + nu.join(" + ");
  }
  music(null); sfx("clear");
  G.eb = [];
}
function toOver() { G.mode = "over"; G.ct = 600; music(null); sfx("over"); store.set("hi", G.hi); }
function quitToTitle() { store.set("hi", G.hi); G.paused = false; G.mode = "title"; G.boss = null; G.en = []; G.eb = []; G.pb = []; G.items = []; music(null); setTheme(0); }

function updPlay() {
  G.st++; G.pt++;
  if (G.phase === "intro" && G.st >= 170) G.phase = "waves";
  if (G.phase === "intro" || G.phase === "waves") while (G.evi < G.ev.length && G.ev[G.evi].t <= G.st) { const w = G.ev[G.evi++]; WAVES[w.k](w.a); }
  if (G.phase === "waves" && G.evi >= G.ev.length && G.st > G.evEnd && !G.en.some(e => !e.dead && !e.ground)) { G.phase = "warn"; G.pt = 0; music(null); sfx("warn"); }
  if (G.phase === "warn" && G.pt >= 200) { spawnBoss(); G.phase = "boss"; music("boss", TRANSPOSE[G.stage]); }
  if (G.phase === "clear" && G.pt >= 330) { G.stage++; if (G.stage >= NSTAGE) { G.stage = 0; G.loop++; } startStage(); }

  updPlayer();
  for (const e of G.en) updEnemy(e);
  updBoss();
  const p = G.p;

  // player bullets
  for (const b of G.pb) {
    if (b.bomb) { b.vy = Math.min(3, b.vy + (b.k === "hbomb" ? 0.07 : 0.1)); b.vx *= 0.99; }
    b.x += b.vx; b.y += b.vy;
    if (b.bomb && b.y >= WATER - 1) { bombBlast(b.x, WATER - 3, b.bomb); b.dead = true; continue; }
    if (b.x > W + 10 || b.x < -10 || b.y < TOP - 4 || b.y > PF_BOT + 4) { b.dead = true; continue; }
    for (const e of G.en) {
      if (e.dead || e.warn > 0) continue;
      if (Math.abs(b.x - e.x) < e.hw + b.w / 2 && Math.abs(b.y - ecy(e)) < e.hh + b.h / 2) {
        if (b.pierce) { if (b.hit.has(e.id)) continue; b.hit.add(e.id); hitEnemy(e, b.dmg, b.x, b.y); continue; }
        if (b.bomb) bombBlast(b.x, b.y, b.bomb); else hitEnemy(e, b.dmg, b.x, b.y);
        b.dead = true; break;
      }
    }
    if (!b.dead && G.boss && (!b.pierce || !b.hit.has(-1))) {
      if (hitBoss(b.x, b.y, b.w, b.h, b.bomb ? b.bomb.boss : b.dmg)) {
        if (b.bomb) { explosion(b.x, b.y, b.k === "hbomb" ? 2 : 1); b.dead = true; }
        else if (b.pierce) b.hit.add(-1);
        else b.dead = true;
      }
    }
  }
  // gunfire can shoot down missiles
  for (const m of G.eb) if (m.msl) for (const b of G.pb) if (!b.dead && !b.bomb && Math.abs(b.x - m.x) < 4 + b.w / 2 && Math.abs(b.y - m.y) < 4) {
    m.dead = true; if (!b.pierce) b.dead = true; explosion(m.x, m.y, 0); addScore(100, m.x, m.y - 6); break;
  }
  G.eb = G.eb.filter(b => !b.dead);
  G.pb = G.pb.filter(b => !b.dead);

  // enemy bullets
  for (const b of G.eb) {
    b.t++;
    if (b.g) b.vy += b.g;
    if (b.home) {   // missiles climb, then turn toward the player for a while
      if (b.t > 25 && b.t < b.home && p.alive) {
        const cur = Math.atan2(b.vy, b.vx), want = Math.atan2(p.y - b.y, p.x - b.x);
        let d = want - cur; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
        const a = cur + clamp(d, -0.045, 0.045);
        b.vx = Math.cos(a) * b.sp; b.vy = Math.sin(a) * b.sp;
      }
      if (b.t % 4 === 0) G.fx.push({ k: "smoke", x: b.x, y: b.y, vx: 0, vy: 0, t: 0, life: 18, r: 1, light: true });
    }
    b.x += b.vx; b.y += b.vy;
    if (b.x < -8 || b.x > W + 8 || b.y < TOP - 6 || b.y > WATER) b.dead = true;
    else if (p.alive && Math.abs(b.x - (p.x + 2)) < b.r + 2 && Math.abs(b.y - p.y) < b.r + 2 && Math.hypot(b.x - p.x - 2, b.y - p.y) < b.r + 1.8) { b.dead = true; playerHit(); }
  }
  G.eb = G.eb.filter(b => !b.dead);

  // bodies
  if (p.alive) {
    for (const e of G.en) {
      if (e.dead || e.warn > 0) continue;
      if (Math.abs(e.x - p.x) < e.hw + 5 && Math.abs(ecy(e) - p.y) < e.hh + 2) { playerHit(); if (!e.ground && e.hp <= 3) killEnemy(e); }
    }
    if (bossTouches(p.x, p.y)) playerHit();
  }
  G.en = G.en.filter(e => !e.dead);

  // items
  for (const it of G.items) {
    it.t++;
    if (it.k === "pod") { it.x += it.vx; it.y += Math.sin(it.t * 0.08) * 0.3; }
    else { it.vy = Math.min(it.vy + 0.04, 0.9); it.x += it.vx; it.y += it.vy; if (it.y > WATER - 4) { it.y = WATER - 4; it.vy = -1.1; } it.vx = lerp(it.vx, -0.6, 0.02); }
    if (p.alive) {
      const d = Math.hypot(p.x - it.x, p.y - it.y);
      if (d < 34 && d > 0.1) { it.x += (p.x - it.x) / d * 1.8; it.y += (p.y - it.y) / d * 1.8; }
      if (d < 11) { it.dead = true; pickup(it); }
    }
    if (it.x < -12) it.dead = true;
  }
  G.items = G.items.filter(i => !i.dead);
  if (G.shake > 0) G.shake *= 0.88;
  if (G.shake < 0.3) G.shake = 0;
  if (G.flash > 0) G.flash--;
}
function bombBlast(x, y, bm) {
  const big = bm.blast > 12;
  explosion(x, y, big ? 2 : 1);
  if (y > WATER - 6) splash(x, big ? 2 : 1, true);
  for (const e of G.en) if (!e.dead && !e.warn && Math.abs(e.x - x) < e.hw + bm.blast && Math.abs(ecy(e) - y) < e.hh + bm.blast) hitEnemy(e, e.ground ? bm.ground : bm.air, x, y);
  hitBoss(x, y, bm.blast * 2, bm.blast * 2, bm.boss);
}
function pickup(it) {
  const p = G.p;
  if (it.k === "medal") { addScore(500 * (G.loop + 1), it.x, it.y - 6); sfx("medal"); return; }
  addScore(100, it.x, it.y, false);
  if (it.blue) {
    sfx("blue"); G.flash = 12; G.eb = [];
    for (const e of G.en) if (!e.dead && !e.warn) { if (e.type === "bomber" || e.type === "destroyer") hitEnemy(e, 20, e.x, ecy(e)); else killEnemy(e, true); }
    if (G.boss && !G.boss.dying) { G.boss.hp -= 25; if (G.boss.hp <= 0) bossDead(); }
    return;
  }
  p.sel = (p.sel + 1) % SLOTS.length;
  sfx("pod");
}

function updFX() {
  for (const f of G.fx) {
    f.t++;
    switch (f.k) {
      case "boom": if (f.t > 0) { f.x += f.vx; f.y += f.vy; } break;
      case "spark": f.x += f.vx; f.y += f.vy; f.vx *= 0.92; f.vy *= 0.92; break;
      case "smoke": f.x += f.vx; f.y += f.vy; break;
      case "deb": f.vy += 0.1; f.x += f.vx; f.y += f.vy; if (f.y > WATER) f.t = f.life; break;
      case "drop": f.vy += 0.12; f.x += f.vx - 0.3; f.y += f.vy; if (f.y > WATER + 1) f.t = f.life; break;
      case "pop": f.y -= 0.4; break;
      case "wreck":
        f.vy += 0.05; f.x += f.vx; f.y += f.vy; f.ang += f.va;
        if (f.t % 2 === 0) smoke(f.x, f.y, f.s.w > 40);
        if (f.y > WATER - 2) { f.t = f.life; splash(f.x, f.s.w > 40 ? 4 : 2); }
        break;
      case "sink": if (f.t % 4 === 0) smoke(f.x + rand(-10, 10), f.y - 10 + f.t * 0.12); break;
    }
  }
  G.fx = G.fx.filter(f => f.t < f.life);
  if (G.fx.length > 700) G.fx.splice(0, G.fx.length - 700);
}

function autopilot() {   // used by the self-test
  const p = G.p;
  inp.fire = true;
  if (G.mode !== "play") { inp.anyHit = G.t % 30 === 0; return; }
  if (!p || !p.alive) return;
  let ty = 95;
  if (G.boss) ty = isAir(G.boss) ? G.boss.y : G.boss.y + G.boss.sink - 20;
  else { const e = G.en.filter(e => !e.dead && !e.warn && e.x > p.x).sort((a, b) => a.x - b.x)[0]; if (e) ty = ecy(e); }
  inp.y = Math.abs(ty - p.y) > 3 ? Math.sign(ty - p.y) : 0;
  inp.x = Math.abs(70 - p.x) > 4 ? Math.sign(70 - p.x) : 0;
  G.want = G.want ?? 0;
  if (p.sel === G.want % SLOTS.length) { inp.powerHit = true; G.want++; }
}

function update() {
  G.t++;
  poll();
  if (inp.pauseHit && G.mode === "play") { G.paused = !G.paused; if (G.paused) store.set("hi", G.hi); return; }
  if (G.paused) {
    if (inp.tap) {
      if (inp.tap.y > H / 2 + 14 && inp.tap.y < H / 2 + 26) toggleSound();
      else if (inp.tap.y >= H / 2 + 26 && inp.tap.y < H / 2 + 40) toggleCtrl();
      else if (inp.tap.y >= H / 2 + 40 && inp.tap.y < H / 2 + 54) quitToTitle();
      else G.paused = false;
    } else if (inp.fireHit) G.paused = false;
    return;
  }
  if (G.mode === "title") {
    if (BG.i < 0) setTheme(0);
    updBG(false);
    if (inp.anyHit) { G.mode = "select"; G.lastX = inp.x; sfx("pod"); }
    return;
  }
  if (G.mode === "select") {
    updBG(false);
    // left/right: plane (locked ones can be looked at), up/down: difficulty, fire: take off
    if (inp.x && inp.x !== G.lastX) { G.plane = (G.plane + inp.x + PLANES.length) % PLANES.length; sfx("medal"); }
    if (inp.y && inp.y !== G.lastY) { G.diff = clamp(G.diff + inp.y, 0, 2); store.set("diff", G.diff); sfx("medal"); }
    G.lastX = inp.x; G.lastY = inp.y;
    if (inp.pauseHit) { G.mode = "title"; return; }
    const go = () => {
      if (!unlocked(G.plane)) { sfx("nope"); return; }
      store.set("plane", G.plane); store.set("diff", G.diff); startGame();
    };
    if (inp.tap) {
      const hit = r => inp.tap.x >= r.x && inp.tap.x < r.x + r.w && inp.tap.y >= r.y && inp.tap.y < r.y + r.h;

  }

  updPlay();
  updFX();
  if (G.mode === "over") {
    G.ct--;
    if (inp.anyHit && G.ct < 580) {
      G.score = 0; G.lives = 3; G.nextLife = 30000; G.p = newPlayer(); G.mode = "play"; G.eb = [];

function fcirc(x, y, r) { circleSpans(ctx, Math.round(x), Math.round(y), Math.max(0, Math.round(r))); }
function drawSpr(s, x, y, flip, white, base) {

  const dx = Math.round(x - s.w / 2), dy = Math.round(base ? y - s.base : y - s.cy);

}
function drawProps(s, dx, dy, flip) {
  ctx.fillStyle = "rgba(235,235,235,0.6)";
  for (const [px, py, ph] of s.props) {
    const x = flip ? dx + s.w - 1 - px : dx + px, hh = G.t % 2 ? ph : Math.round(ph * 0.55);
    ctx.fillRect(x, Math.round(dy + py - hh / 2), 1, hh);

}
function drawRot(s, x, y, ang, flip) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(ang);
  ctx.drawImage(flip ? s.flip : s.img, -Math.round(s.w / 2), -Math.round(s.cy));

function drawTurret(x, y, ang, big, col) {
  x = Math.round(x); y = Math.round(y);
  const r = big ? 4 : 2, len = big ? 9 : 6;
  ctx.fillStyle = OUTLINE;
  for (let i = r - 1; i <= len; i++) ctx.fillRect(Math.round(x + Math.cos(ang) * i) - 1, Math.round(y + Math.sin(ang) * i) - 1, big ? 3 : 2, big ? 3 : 2);
  ctx.fillStyle = "#2e3138";
  for (let i = r; i < len; i++) ctx.fillRect(Math.round(x + Math.cos(ang) * i), Math.round(y + Math.sin(ang) * i), big ? 2 : 1, big ? 2 : 1);
  ctx.fillStyle = OUTLINE; fcirc(x, y, r + 1);

}
const clipWater = () => { ctx.save(); ctx.beginPath(); ctx.rect(-40, 0, W + 80, WATER + 1); ctx.clip(); };

function drawBoss() {
  const b = G.boss;
  if (!b) return;
  const white = b.flash > 0 && b.t % 4 === 0;
  if (isAir(b)) {
    if (b.dying > 140) drawRot(b.s, b.x, b.y, b.ang, true);

      const [dx, dy] = drawSpr(b.s, b.x, b.y, true, false); drawProps(b.s, dx, dy, true);
      if (white) { ctx.globalAlpha = 0.45; ctx.drawImage(b.s.whiteFlip, dx, dy); ctx.globalAlpha = 1; }
    }
    if (b.dying > 140) return;
    for (const q of b.parts) {
      const px = b.x + q.ox, py = b.y + q.oy;
      if (q.alive) drawTurret(px, py, G.p && G.p.alive ? aim(px, py) : Math.PI, b.kind === "gunship", q.flash ? "#ffffff" : b.kind === "gunship" ? "#7a6e54" : "#59616c");
      else { ctx.fillStyle = "#24262b"; ctx.fillRect(Math.round(px) - 3, Math.round(py) - 2, 6, 4); }
    }
  } else {
    clipWater();
    ctx.save();
    ctx.translate(Math.round(b.x), Math.round(b.y + b.sink)); ctx.rotate(b.ang);
    ctx.drawImage(b.s.img, -Math.round(b.s.w / 2), -b.s.base);
    if (white) { ctx.globalAlpha = 0.45; ctx.drawImage(b.s.white, -Math.round(b.s.w / 2), -b.s.base); ctx.globalAlpha = 1; }
    for (const q of b.parts) {
      if (!q.alive) { ctx.fillStyle = "#24262b"; ctx.fillRect(q.ox - 4, q.oy - 2, 8, 4); continue; }
      if (q.kind === "cat") {   // deck catapult: a rail with a sled that glows before a launch
        ctx.fillStyle = OUTLINE; ctx.fillRect(q.ox - 9, q.oy - 2, 18, 4);
        ctx.fillStyle = q.flash ? "#ffffff" : "#8a8478"; ctx.fillRect(q.ox - 8, q.oy - 1, 16, 2);
        ctx.fillStyle = q.cd < 30 && G.t % 6 < 3 ? "#ffd24a" : "#4a4640"; ctx.fillRect(q.ox - 8 + Math.round(clamp(q.cd / 12, 0, 12)), q.oy - 2, 4, 2);
      } else if (q.kind === "hatch") {

    ctx.restore();

function drawWorld() {
  // ships and sinking wrecks, clipped at the waterline
  clipWater();

  }
  for (const e of G.en) if (e.ground) {
    const [dx, dy] = drawSpr(SPR[e.spr], e.x, e.y, false, false, true);
    if (e.flash > 0 && e.flash % 2) { ctx.globalAlpha = 0.5; ctx.drawImage(SPR[e.spr].white, dx, dy); ctx.globalAlpha = 1; }
  }
  ctx.restore();
  if (G.boss && !isAir(G.boss)) drawBoss();
  // items
  for (const it of G.items) {
    const s = it.k === "medal" ? SPR.medal : it.blue ? SPR.bluePod : SPR.pod, sq = Math.abs(Math.cos(it.t * 0.12));

    else { const [dx, dy] = drawSpr(s, e.x, e.y, flip, e.flash > 0); drawProps(s, dx, dy, flip); }
  }

  for (const b of G.pb) {
    const x = Math.round(b.x), y = Math.round(b.y);
    if (b.k === "b" || b.k === "r") { ctx.fillStyle = "#ffd24a"; ctx.fillRect(x - 3, y, 6, 1); ctx.fillStyle = "#ffffff"; ctx.fillRect(b.vx > 0 ? x + 1 : x - 3, y, 2, 1); }

    else if (b.k === "rail") { ctx.fillStyle = "#3aa8ff"; ctx.fillRect(x - 7, y - 1, 14, 3); ctx.fillStyle = "#bff0ff"; ctx.fillRect(x - 6, y, 13, 1); ctx.fillStyle = "#ffffff"; ctx.fillRect(x + 3, y, 4, 1); }
    else if (b.k === "hbomb") { ctx.fillStyle = OUTLINE; ctx.fillRect(x - 4, y - 3, 9, 6); ctx.fillStyle = "#3a404c"; ctx.fillRect(x - 3, y - 2, 7, 4); ctx.fillStyle = "#8a93a0"; ctx.fillRect(x - 3, y - 2, 2, 1); ctx.fillStyle = "#c3412f"; ctx.fillRect(x - 4, y - 1, 1, 2); }
    else if (b.k === "c") { ctx.fillStyle = OUTLINE; ctx.fillRect(x - 5, y - 2, 10, 5); ctx.fillStyle = "#ff8a2a"; ctx.fillRect(x - 4, y - 1, 8, 3); ctx.fillStyle = "#fff2c0"; ctx.fillRect(x, y - 1, 3, 2); }

  selCards().forEach((r, i) => {
    const P = PLANES[i], on = G.plane === i, s = SPR["player" + i], open = unlocked(i);
    ctx.fillStyle = on ? "rgba(40,60,110,0.85)" : "rgba(14,18,32,0.8)"; ctx.fillRect(r.x, r.y, r.w, r.h);
    outline(r, on ? blink : "#33415f");
    const bob = on ? Math.round(Math.sin(G.t * 0.08) * 1.5) : 0, sx = Math.round(r.x + r.w / 2 - s.w / 2), sy = r.y + 6 + bob;
    if (open) { ctx.drawImage(s.img, sx, sy); if (G.t % 2) { ctx.fillStyle = "rgba(235,235,235,0.6)"; for (const [px, py, ph] of s.props) ctx.fillRect(sx + px, Math.round(sy + py - ph / 2), 1, ph); } }
    else { ctx.globalAlpha = 0.35; ctx.filter = "brightness(0)"; ctx.drawImage(s.img, sx, sy); ctx.filter = "none"; ctx.globalAlpha = 1; }
    txt(open ? P.name : "LOCKED", r.x + r.w / 2, r.y + 26, open ? (on ? "#ffffff" : "#aab4c8") : "#7a8498", 1, 1, null);
    if (!open) txt(P.unlock >= NSTAGE ? "CLEAR ALL" : "CLEAR " + P.unlock, r.x + r.w / 2, r.y + 35, "#ffb07a", 1, 1, null);
  });
  // details of the chosen plane
  const P = PLANES[G.plane], open = unlocked(G.plane), d = { x: Math.round(cx - 150), y: 84, w: 300, h: 76 };
  ctx.fillStyle = "rgba(14,18,32,0.85)"; ctx.fillRect(d.x, d.y, d.w, d.h); outline(d, "#33415f");
  const s = SPR["player" + G.plane], bx = d.x + 40, by = d.y + 38 - s.h;
  if (open) { ctx.drawImage(s.img, bx - s.w, by, s.w * 2, s.h * 2); if (G.t % 2) { ctx.fillStyle = "rgba(235,235,235,0.6)"; for (const [px, py, ph] of s.props) ctx.fillRect(bx - s.w + px * 2, Math.round(by + (py - ph / 2) * 2), 2, ph * 2); } }
  else { ctx.globalAlpha = 0.35; ctx.filter = "brightness(0)"; ctx.drawImage(s.img, bx - s.w, by, s.w * 2, s.h * 2); ctx.filter = "none"; ctx.globalAlpha = 1; }
  txt(P.name, bx, d.y + 52, open ? "#ffffff" : "#7a8498", 1, 2);
  const tx = d.x + 92;
  txt(P.role, tx, d.y + 5, "#ffb07a", 0, 1, null);
  [["SPEED", P.bars[0]], ["POWER", P.bars[1]]].forEach(([n, v], j) => {
    const y = d.y + 16 + j * 9;
    txt(n, tx, y, "#dfe6f5", 0, 1, null);
    for (let k = 0; k < 5; k++) { ctx.fillStyle = k < v ? (j ? "#ff9a2a" : "#7fe6ff") : "#2c3754"; ctx.fillRect(tx + 40 + k * 9, y + 1, 7, 5); }
  });
  P.info.forEach((l, j) => txt(l, tx, d.y + 36 + j * 9, j === 3 && P.extra ? "#7fe6ff" : "#dfe6f5", 0, 1, null));
  if (!open) { ctx.fillStyle = "rgba(5,8,15,0.82)"; ctx.fillRect(d.x + 1, d.y + 1, d.w - 2, d.h - 2);
    txt(P.unlock >= NSTAGE ? "CLEAR ALL STAGES TO UNLOCK" : "CLEAR STAGE " + P.unlock + " TO UNLOCK", cx, d.y + 34, "#ffd24a", 1); }
  // difficulty
  diffBtns().forEach((r, i) => {
    const on = G.diff === i, D0 = DIFFS[i];
    ctx.fillStyle = on ? D0.col : "rgba(14,18,32,0.85)"; ctx.fillRect(r.x, r.y, r.w, r.h);
    outline(r, on ? "#ffffff" : "#33415f");
    txt(D0.n, r.x + r.w / 2, r.y + 4, on ? "#10131c" : "#aab4c8", 1, 1, null);
  });
  if (touchMode) {
    const g = goBtn();
    ctx.fillStyle = open ? "#ff9a2a" : "#2c3754"; ctx.fillRect(g.x, g.y, g.w, g.h); outline(g, open ? "#ffd24a" : "#33415f");
    txt(open ? "TAKE OFF" : "LOCKED", cx, g.y + 4, open ? "#10131c" : "#7a8498", 1, 1, null);
  } else if (G.t % 50 < 34) txt(open ? "LEFT/RIGHT PLANE   UP/DOWN DIFFICULTY   FIRE TAKE OFF" : "LEFT/RIGHT PLANE   UP/DOWN DIFFICULTY", cx, 188, "#ffffff", 1);
}

function draw() {
  ctx.save();
  if (G.shake > 0) ctx.translate(Math.round(rand(-1, 1) * G.shake * 0.5), Math.round(rand(-1, 1) * G.shake * 0.5));
  drawBG();
  const inGame = G.mode === "play" || G.mode === "over";
  if (inGame) drawWorld();
  drawFG();
  if (inGame) drawEnemyBullets();
  ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash / 16})`; ctx.fillRect(0, 0, W, H); }
  if (G.mode === "title" || G.mode === "select") {
    if (G.mode === "title") drawTitle(); else drawSelect();
    ctx.fillStyle = "#0a0d14"; ctx.fillRect(0, 0, W, TOP); ctx.fillRect(0, PF_BOT, W, BAR_H);
    txt("SOUND " + (soundOn ? "ON" : "OFF"), W / 2, PF_BOT + 4, "#5a6478", 1, 1, null);
  } else drawHUD();
  drawCentre();
}

// ============================================================ main loop
function resize() {
  const a = innerWidth / Math.max(1, innerHeight);
  W = clamp(Math.round(H * a / 2) * 2, 320, 480);
  cv.width = W; cv.height = H;
  ctx.imageSmoothingEnabled = false;
  SCALE = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * SCALE + "px"; cv.style.height = H * SCALE + "px";
  cv.style.left = (innerWidth - W * SCALE) / 2 + "px"; cv.style.top = (innerHeight - H * SCALE) / 2 + "px";
  if (BG.i >= 0) setTheme(BG.i);
}
addEventListener("resize", resize);
buildSprites();
resize();
setTheme(0);
let lastT = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - lastT); lastT = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) { update(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__G = G; window.__SPR = SPR;
window.__step = n => { for (let i = 0; i < n; i++) { update(); } };
window.__draw = draw;
</script>
